events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # Performance
    sendfile        on;
    keepalive_timeout 65;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json
               application/javascript text/xml application/xml image/svg+xml;

    # Cap par défaut pour toutes les routes. L'API relève ce plafond elle-même
    # (voir location /api/) pour les uploads (prompts ≤ 3 Mo, avatar ≤ 2 Mo).
    client_max_body_size 2M;

    # Limitation de débit par IP devant l'API. Le ThrottlerGuard NestJS
    # (voir apps/api/src/app.module.ts) protège déjà chaque route ; ceci
    # absorbe en plus les pics volumétriques avant qu'ils n'atteignent Node.
    limit_req_zone  $binary_remote_addr zone=api_general:10m rate=20r/s;
    limit_req_zone  $binary_remote_addr zone=api_auth:10m    rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Redirection HTTP → HTTPS
    server {
        listen 80;
        server_name promptverse.biz www.promptverse.biz;

        # Requis par certbot (méthode webroot) pour le challenge ACME.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Serveur principal HTTPS
    server {
        listen 443 ssl;
        http2 on;
        server_name promptverse.biz www.promptverse.biz;

        ssl_certificate     /etc/letsencrypt/live/promptverse.biz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/promptverse.biz/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # En-têtes de sécurité
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # `script-src`'s hash couvre le script inline anti-flash de thème dans
        # index.html — à recalculer si son contenu change (depuis apps/client/) :
        #   python3 -c "import re,hashlib,base64; html=open('index.html').read(); m=re.search(r'<script>(.*?)</script>', html, re.S); print('sha256-' + base64.b64encode(hashlib.sha256(m.group(1).encode()).digest()).decode())"
        # img-src 'self' couvre aussi /storage/ (proxy MinIO ci-dessous, même origine).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-3LAyY/blQtJQY7Ar+VhcfnzKGEzQKJiNu/ldjrKD+pQ='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

        # Limiteur strict pour l'auth (brute-force / credential stuffing).
        # Déclaré avant le bloc générique /api/ pour gagner par préfixe le plus long.
        location /api/v1/auth/ {
            limit_req  zone=api_auth burst=10 nodelay;
            limit_conn conn_per_ip 20;
            client_max_body_size 2M;
            proxy_pass http://api:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API → NestJS
        location /api/ {
            limit_req  zone=api_general burst=40 nodelay;
            limit_conn conn_per_ip 50;
            # POST /api/v1/prompts accepte 1 coverImage + jusqu'à 10 previewImages
            # (FileFieldsInterceptor), chacune plafonnée à 8 Mo par Multer
            # (apps/api/src/modules/prompts/prompts.module.ts) → jusqu'à ~88 Mo
            # au total. 100M laisse une marge.
            client_max_body_size 100M;
            proxy_pass http://api:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Assets publics (couvertures/aperçus de prompts) servis par MinIO.
        # Lecture seule : les uploads passent par l'API (StorageService), jamais
        # directement par le navigateur. VITE_ASSETS_URL doit valoir
        # https://promptverse.biz/storage/<AWS_S3_BUCKET>.
        location /storage/ {
            limit_except GET HEAD {
                deny all;
            }
            proxy_pass http://minio:9000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Frontend React (build Vite servi par le nginx du conteneur `client`)
        location / {
            proxy_pass http://client:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
