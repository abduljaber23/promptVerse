<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    :root {
      --bg: #1d232a;
      --surface: #191e24;
      --field: #1d232a;
      --border: #2b333d;
      --text: #e6e9ec;
      --text-soft: #c5cad1;
      --muted: #9aa2ad;
      --primary: #0077ff;
      --primary-hover: #0068df;
      --danger: #f87171;
      --radius-box: 16px;
      --radius-btn: 8px;
    }

    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); font-family: 'Inter', system-ui, -apple-system, sans-serif; color: var(--text-soft); -webkit-font-smoothing: antialiased; }
    a { color: var(--primary); text-decoration: none; }
    a:hover { color: var(--primary-hover); }

    .screen {
      width: 1440px; min-height: 820px;
      display: flex; align-items: center; justify-content: center;
      padding: 72px 24px;
      background:
        radial-gradient(620px 260px at 50% 0%, rgba(0, 119, 255, 0.10), transparent 70%),
        var(--bg);
    }

    .auth-card {
      width: 440px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-box);
      padding: 40px;
    }
    .brand { text-align: center; font-size: 22px; font-weight: 700; color: var(--text); letter-spacing: -0.01em; }
    .brand b { color: var(--primary); }
    .auth-card h1 { margin: 10px 0 0; text-align: center; font-size: 22px; font-weight: 600; color: var(--text); }
    .auth-card .sub { margin: 8px 0 28px; text-align: center; font-size: 14px; line-height: 1.55; color: var(--muted); }

    .field-group { margin-bottom: 16px; }
    .field-group label { display: block; margin-bottom: 7px; font-size: 13px; font-weight: 500; color: var(--text-soft); }
    .field-group label .req { color: var(--danger); margin-left: 2px; }
    .field-group input {
      width: 100%; height: 44px; padding: 0 14px;
      background: var(--field); border: 1px solid var(--border); border-radius: var(--radius-btn);
      color: var(--text); font-size: 14px; font-family: inherit;
    }
    .field-group input::placeholder { color: var(--muted); }
    .field-group input:focus { outline: none; border-color: var(--primary); }

    .row-end { text-align: right; margin-top: 8px; }
    .row-end a { font-size: 13px; font-weight: 500; }

    .btn-submit {
      width: 100%; height: 44px; margin-top: 18px;
      background: var(--primary); color: #fff;
      border: none; border-radius: var(--radius-btn);
      font-family: inherit; font-size: 14.5px; font-weight: 600; cursor: pointer;
    }
    .btn-submit:hover { background: var(--primary-hover); }

    .alt { margin-top: 20px; text-align: center; font-size: 13.5px; color: var(--muted); }
    .alt a { font-weight: 600; }
  </style>
</helmet>

<div class="screen">
  <div class="auth-card">
    <div class="brand"><b>Prompt</b>Verse</div>
    <h1>Connexion</h1>
    <p class="sub">Connectez-vous pour retrouver vos achats et vos prompts en vente.</p>

    <div class="field-group">
      <label>Adresse e-mail <span class="req">*</span></label>
      <input type="email" placeholder="vous@exemple.com">
    </div>

    <div class="field-group">
      <label>Mot de passe <span class="req">*</span></label>
      <input type="password" placeholder="••••••••">
      <div class="row-end"><a href="#">Mot de passe oublié ?</a></div>
    </div>

    <button class="btn-submit">Se connecter</button>

    <p class="alt">Pas encore de compte ? <a href="#">Créer un compte</a></p>
  </div>
</div>
</x-dc>
</body>
</html>
