name: promptverse

# Sur le VPS :  docker compose -f docker-compose.prod.yml up -d
# Images pré-construites par la CI (voir .github/workflows/deploy.yml), pas de
# `build:` ici. `.env` doit exister à côté de ce fichier (jamais commité, jamais
# copié par la CI — à créer une fois manuellement sur le VPS).

services:
  # ────────────────────── Reverse proxy (TLS + routage) ───────────────────
  # Certbot tourne en natif sur l'hôte (apt install certbot), pas en conteneur —
  # voir les étapes VPS. Ces deux chemins sont donc montés directement depuis
  # l'hôte : /etc/letsencrypt (certificats) et /var/www/certbot (challenge ACME
  # en mode webroot pour le renouvellement, une fois nginx déjà démarré).
  nginx:
    image: nginx:1.27-alpine
    container_name: promptverse_nginx
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api:
        condition: service_healthy
      client:
        condition: service_healthy
    restart: unless-stopped

  # ───────────────────────────── API (NestJS) ─────────────────────────────
  api:
    image: ${DOCKER_USERNAME}/promptverse-backend:${IMAGE_TAG:-latest}
    container_name: promptverse_api
    env_file: .env
    environment:
      # Couplages réseau imposés (doivent correspondre aux noms de services).
      NODE_ENV: production
      PORT: "3000"
      DB_HOST: database
      DB_PORT: "3306"
      REDIS_URL: redis://redis:6379
      AWS_S3_ENDPOINT: http://seaweedfs:8333
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs-setup:
        condition: service_completed_successfully
    restart: unless-stopped

  # ─────────────────────────── Client (React/nginx) ──────────────────────
  client:
    image: ${DOCKER_USERNAME}/promptverse-frontend:${IMAGE_TAG:-latest}
    container_name: promptverse_client
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ───────────────────────────── MySQL ──────────────────────────────────
  database:
    image: mysql:8.4
    container_name: promptverse_database
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-prompt_verse}
      MYSQL_USER: ${DB_USER:-promptverse}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # ───────────────────────────── Redis ─────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: promptverse_redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ────────────────────── SeaweedFS (stockage S3) ──────────────────────
  # `weed server` tout-en-un (master + volume + filer + passerelle S3 :8333).
  # La config S3 est générée au démarrage à partir des variables AWS_* :
  #   - identité admin = mêmes clés que celles utilisées par l'API ;
  #   - identité `anonymous` = lecture seule sur le bucket (VITE_ASSETS_URL).
  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    container_name: promptverse_seaweedfs
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-prompt-verse}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        cat > /tmp/s3.json <<EOF
        {
          "identities": [
            {
              "name": "admin",
              "credentials": [{ "accessKey": "$$AWS_ACCESS_KEY_ID", "secretKey": "$$AWS_SECRET_ACCESS_KEY" }],
              "actions": ["Admin", "Read", "List", "Tagging", "Write"]
            },
            { "name": "anonymous", "actions": ["Read:$$AWS_S3_BUCKET"] }
          ]
        }
        EOF
        exec /entrypoint.sh server -ip=seaweedfs -ip.bind=0.0.0.0 \
          -master.telemetry=false \
          -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  # One-shot : crée le bucket s'il n'existe pas encore (idempotent).
  seaweedfs-setup:
    image: chrislusf/seaweedfs:4.47
    container_name: promptverse_seaweedfs_setup
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-prompt-verse}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        if echo "s3.bucket.list" | weed shell -master=seaweedfs:9333 | grep -qw "$$AWS_S3_BUCKET"; then
          echo "Bucket SeaweedFS déjà présent : $$AWS_S3_BUCKET"
        else
          echo "s3.bucket.create -name $$AWS_S3_BUCKET" | weed shell -master=seaweedfs:9333
          echo "s3.bucket.list" | weed shell -master=seaweedfs:9333 | grep -qw "$$AWS_S3_BUCKET"
          echo "Bucket SeaweedFS prêt : $$AWS_S3_BUCKET"
        fi
    restart: "no"

volumes:
  mysql_data:
  seaweedfs_data:
  redis_data:

networks:
  default:
    name: promptverse_network
