name: promptverse

# Compose de DEV : `docker compose -f docker-compose.dev.yml up -d`
# api + client tournent avec hot reload (nest start --watch / vite), code
# monté en volume. Pas de migrations automatiques au démarrage de l'api
# (comme en local : `npm run migration:run` build d'abord) — lancer :
#   docker compose -f docker-compose.dev.yml exec api npm run migration:run
# Le build multi-stage de prod (images figées, pas de hot reload) est dans
# docker-compose.prod.yml (images construites par la CI).

services:
  # ───────────────────────────── API (NestJS, hot reload) ─────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    container_name: promptverse_api
    env_file: apps/api/.env.development
    environment:
      # Couplages réseau imposés (doivent correspondre aux noms de services).
      DB_HOST: database
      DB_PORT: "3306"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      # Mêmes identifiants que le service `database` ci-dessous (root .env),
      # pour ne pas les dupliquer séparément dans apps/api/.env.development.
      DB_NAME: ${DB_NAME:-prompt_verse}
      DB_USER: ${DB_USER:-promptverse}
      DB_PASSWORD: ${DB_PASSWORD:-promptverse}
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - ./apps/api:/app
      - api_node_modules:/app/node_modules
    depends_on:
      database:
        condition: service_healthy

  # ─────────────────────────── Client (Vite, hot reload) ──────────────────
  client:
    build:
      context: ./apps/client
      dockerfile: Dockerfile.dev
    container_name: promptverse_client
    ports:
      - "${CLIENT_PORT:-5173}:5173"
    volumes:
      - ./apps/client:/app
      - client_node_modules:/app/node_modules
    depends_on:
      - api

  # ───────────────────────────── MySQL ──────────────────────────────────
  database:
    image: mysql:8.4
    container_name: promptverse_database
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-prompt_verse}
      MYSQL_USER: ${DB_USER:-promptverse}
      MYSQL_PASSWORD: ${DB_PASSWORD:-promptverse}
    ports:
      - "${DB_PORT_HOST:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # ─────────────────────────── Mailpit (SMTP dev) ─────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: promptverse_mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped

volumes:
  mysql_data:
  api_node_modules:
  client_node_modules:

networks:
  default:
    name: promptverse_network
