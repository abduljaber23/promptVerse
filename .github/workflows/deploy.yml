name: CI/CD Pipeline — Build, Test & Deploy

on:
  push:
    branches: [deploy]
  pull_request:
    branches: [deploy]

env:
  REGISTRY: docker.io
  BACKEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/promptverse-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/promptverse-frontend

jobs:
  test-backend:
    name: 🧪 Tests Backend
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: test_db
          MYSQL_USER: test
          MYSQL_PASSWORD: test
        ports:
          - "3306:3306"
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u test -ptest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json

      - name: 📦 Install dependencies
        run: npm install
        working-directory: apps/api

      - name: 🔍 Lint
        run: npm run lint
        working-directory: apps/api

      - name: 🧪 Run tests
        run: npm run test
        working-directory: apps/api
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_USER: test
          DB_PASSWORD: test
          DB_NAME: test_db
          JWT_SECRET: test-secret-key
          NODE_ENV: test

      - name: 📊 Test coverage
        run: npm run test:cov
        working-directory: apps/api


  test-frontend:
    name: 🎨 Tests Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/client/package-lock.json

      - run: npm install
        working-directory: apps/client

      - run: npm run lint
        working-directory: apps/client


      - name: 🏗️ Test build
        run: npm run build
        working-directory: apps/client
        env:
          VITE_API_URL: /api/v1


  build-and-push:
    name: 🐳 Build & Push Docker
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/deploy'

    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: ⚙️ Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🏷️ Generate image tags
        id: meta
        run: |
          echo "version=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "Image tag: ${GITHUB_SHA::7}"

      - name: 🏗️ Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🏗️ Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./apps/client
          file: ./apps/client/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=/api/v1
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: 📤 Copy docker-compose to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "docker-compose.prod.yml,nginx/"
          target: "/opt/promptverse"

      - name: 🚀 Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /opt/promptverse

            docker compose -f docker-compose.prod.yml pull

            # L'entrypoint de l'image `api` (docker-entrypoint.sh) attend la
            # base puis joue les migrations avant de démarrer Nest pas besoin
            # de les rejouer manuellement ici.
            docker compose -f docker-compose.prod.yml up -d \
              --remove-orphans

            docker compose -f docker-compose.prod.yml restart nginx

            docker image prune -f

            echo "✅ Déploiement réussi !"