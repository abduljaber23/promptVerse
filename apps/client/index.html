<!doctype html>
<html lang="fr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="PromptVerse — la marketplace des prompts IA testés et prêts à l'emploi."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>PromptVerse</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Applique le thème persisté avant le rendu React (évite le flash).
      try {
        var t = JSON.parse(localStorage.getItem("promptverse-ui") || "{}");
        if (t && t.state && t.state.theme) {
          document.documentElement.setAttribute("data-theme", t.state.theme);
        }
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
