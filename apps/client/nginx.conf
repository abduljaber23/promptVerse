server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Healthcheck du conteneur
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Proxy vers l'API NestJS — garde le navigateur en same-origin (pas de CORS).
    # Résolution DNS dynamique via le resolver Docker (survit aux redémarrages d'`api`).
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $upstream http://api:3000;
        proxy_pass $upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 25m;
    }

    # Compression des assets texte
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/font-woff2;
    gzip_min_length 1024;

    # Cache agressif des assets hashés du build
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Fallback SPA — le routeur client gère les chemins inconnus
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Durcissement basique
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
