name: promptverse

# `docker compose up --build`
# Outils optionnels (RedisInsight) :  docker compose --profile tools up

services:
  # ───────────────────────────── API (NestJS) ─────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: promptverse/api:latest
    container_name: promptverse_api
    env_file: .env
    environment:
      # Couplages réseau imposés (doivent correspondre aux noms de services).
      NODE_ENV: ${NODE_ENV:-production}
      PORT: "3000"
      DB_HOST: database
      DB_PORT: "3306"
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      # Fichiers uploadés (avatars, couvertures/aperçus de prompts) — stockage
      # disque local, servi par l'API elle-même (voir StorageController).
      - uploads_data:/app/uploads
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ─────────────────────────── Client (React/nginx) ──────────────────────
  client:
    build:
      context: ./apps/client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    image: promptverse/client:latest
    container_name: promptverse_client
    ports:
      - "${CLIENT_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ───────────────────────────── MySQL ──────────────────────────────────
  database:
    image: mysql:8.4
    container_name: promptverse_database
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-prompt_verse}
      MYSQL_USER: ${DB_USER:-promptverse}
      MYSQL_PASSWORD: ${DB_PASSWORD:-promptverse}
    ports:
      - "${DB_PORT_HOST:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # ───────────────────────────── Redis ─────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: promptverse_redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT_HOST:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ─────────────────────────── Mailpit (SMTP dev) ─────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: promptverse_mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped

  # ───────────────────── RedisInsight (profil "tools") ───────────────────
  redisinsight:
    image: redis/redisinsight:latest
    container_name: promptverse_redisinsight
    ports:
      - "${REDISINSIGHT_PORT:-5540}:5540"
    depends_on:
      - redis
    profiles: ["tools"]
    restart: unless-stopped

volumes:
  mysql_data:
  uploads_data:
  redis_data:

networks:
  default:
    name: promptverse_network
