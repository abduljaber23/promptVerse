name: promptverse

# `docker compose up --build`
# Outils optionnels (RedisInsight) :  docker compose --profile tools up

services:
  # ───────────────────────────── API (NestJS) ─────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: promptverse/api:latest
    container_name: promptverse_api
    env_file: .env
    environment:
      # Couplages réseau imposés (doivent correspondre aux noms de services).
      NODE_ENV: ${NODE_ENV:-production}
      PORT: "3000"
      DB_HOST: database
      DB_PORT: "3306"
      REDIS_URL: redis://redis:6379
      AWS_S3_ENDPOINT: http://minio:9000
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    restart: unless-stopped

  # ─────────────────────────── Client (React/nginx) ──────────────────────
  client:
    build:
      context: ./apps/client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
        VITE_ASSETS_URL: ${VITE_ASSETS_URL:-http://localhost:9000/prompt-verse}
    image: promptverse/client:latest
    container_name: promptverse_client
    ports:
      - "${CLIENT_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ───────────────────────────── MySQL ──────────────────────────────────
  database:
    image: mysql:8.4
    container_name: promptverse_database
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-prompt_verse}
      MYSQL_USER: ${DB_USER:-promptverse}
      MYSQL_PASSWORD: ${DB_PASSWORD:-promptverse}
    ports:
      - "${DB_PORT_HOST:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # ───────────────────────────── Redis ─────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: promptverse_redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT_HOST:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ──────────────────────── MinIO (stockage S3) ────────────────────────
  minio:
    image: minio/minio:latest
    container_name: promptverse_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-promptverse}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-promptverse_secret}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  # One-shot : crée le bucket et le rend lisible publiquement (VITE_ASSETS_URL).
  minio-setup:
    image: minio/mc:latest
    container_name: promptverse_minio_setup
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-promptverse}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-promptverse_secret}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-prompt-verse}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          echo 'En attente de MinIO...'; sleep 2;
        done
        mc mb --ignore-existing "local/$$AWS_S3_BUCKET"
        mc anonymous set download "local/$$AWS_S3_BUCKET"
        echo "Bucket MinIO prêt : $$AWS_S3_BUCKET"
    restart: "no"

  # ─────────────────────────── Mailpit (SMTP dev) ─────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: promptverse_mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped

  # ───────────────────── RedisInsight (profil "tools") ───────────────────
  redisinsight:
    image: redis/redisinsight:latest
    container_name: promptverse_redisinsight
    ports:
      - "${REDISINSIGHT_PORT:-5540}:5540"
    depends_on:
      - redis
    profiles: ["tools"]
    restart: unless-stopped

volumes:
  mysql_data:
  minio_data:
  redis_data:

networks:
  default:
    name: promptverse_network
